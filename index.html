<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Vault App</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
    }
    #auth-section, #signup-section, #vault-section {
      display: none;
    }
    .btn {
      padding: 10px;
      margin: 10px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
    }
    .btn-danger {
      background-color: red;
    }
    .vault-item {
      margin: 10px;
      padding: 10px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div id="auth-section">
    <h2>Login</h2>
    <input type="email" id="loginEmail" placeholder="Email" />
    <input type="password" id="loginPassword" placeholder="Password" />
    <button id="loginBtn" class="btn">Login</button>
    <button id="showSignup" class="btn">Sign Up</button>
  </div>

  <div id="signup-section">
    <h2>Sign Up</h2>
    <input type="email" id="signupEmail" placeholder="Email" />
    <input type="password" id="signupPassword" placeholder="Password" />
    <button id="signupBtn" class="btn">Sign Up</button>
    <button id="showLogin" class="btn">Login</button>
  </div>

  <div id="vault-section">
    <h2>Your Vault</h2>
    <button id="logoutBtn" class="btn">Logout</button>
    <input type="text" id="vaultInput" placeholder="Add item to vault" />
    <button id="addVaultBtn" class="btn">Add to Vault</button>
    <div id="vaultItems"></div>

    <!-- Family Functions -->
    <h3>Create or Join Family</h3>
    <button id="createFamilyBtn" class="btn">Create Family</button>
    <button id="joinFamilyBtn" class="btn">Join Family</button>
    <input type="text" id="familyIdInput" placeholder="Enter Family ID" />
    <input type="text" id="familyNameInput" placeholder="Enter Family Name" />
  </div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDZdQx1OxvaL1Irrwx2OMRRUkAYAz4Jpio",
      authDomain: "carroll-fam-v.firebaseapp.com",
      projectId: "carroll-fam-v",
      storageBucket: "carroll-fam-v.appspot.com",
      messagingSenderId: "31202730208",
      appId: "1:31202730208:web:424f6d013231a970ae3085",
      measurementId: "G-6L6FH62554"
    };
    
    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // DOM Elements
    const authSection = document.getElementById("auth-section");
    const signupSection = document.getElementById("signup-section");
    const vaultSection = document.getElementById("vault-section");
    const vaultItemsDiv = document.getElementById("vaultItems");

    // Function for user login
    const loginUser = async () => {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      try {
        await firebase.auth().signInWithEmailAndPassword(email, password);
        console.log("User logged in successfully!");
      } catch (error) {
        console.error("Login Error:", error.message);
        alert("Login Failed: " + error.message);
      }
    };
    document.getElementById("loginBtn").onclick = loginUser;

    // Function for user signup
    const signUpUser = async () => {
      const email = document.getElementById("signupEmail").value;
      const password = document.getElementById("signupPassword").value;
      try {
        const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;

        await firebase.firestore().collection("users").doc(user.uid).set({
          email: email,
          familyId: null,
        });

        console.log("Account created successfully!");
        alert("Account created! Please log in.");
        signupSection.style.display = "none";
        authSection.style.display = "block";
      } catch (error) {
        console.error("Signup Error:", error.message);
        alert("Signup Failed: " + error.message);
      }
    };
    document.getElementById("signupBtn").onclick = signUpUser;

    document.getElementById("showSignup").onclick = () => {
      authSection.style.display = "none";
      signupSection.style.display = "block";
    };

    document.getElementById("showLogin").onclick = () => {
      signupSection.style.display = "none";
      authSection.style.display = "block";
    };

    // Function for user logout
    const logoutUser = async () => {
      try {
        await firebase.auth().signOut();
        console.log("User logged out successfully!");
      } catch (error) {
        console.error("Logout Error:", error.message);
        alert("Logout Failed: " + error.message);
      }
    };
    document.getElementById("logoutBtn").onclick = logoutUser;

    // Function to add item to vault
    const addVaultItem = async () => {
      const item = document.getElementById("vaultInput").value;
      if (!item) {
        alert("Please enter an item to add to the vault.");
        return;
      }
      const currentUser = firebase.auth().currentUser;
      if (currentUser) {
        try {
          await firebase.firestore().collection("vault").add({
            item,
            userId: currentUser.uid
          });
          document.getElementById("vaultInput").value = "";
          console.log("Item added to vault:", item);
        } catch (error) {
          console.error("Error adding item:", error.message);
          alert("Failed to add item: " + error.message);
        }
      }
    };
    document.getElementById("addVaultBtn").onclick = addVaultItem;

    // Function to render vault items
    const renderVaultItems = (items) => {
      vaultItemsDiv.innerHTML = "";
      items.forEach(({ id, item }) => {
        const div = document.createElement("div");
        div.className = "vault-item";
        div.innerHTML = `
          <span>${item}</span>
          <button class="btn btn-sm btn-danger delete-btn" data-id="${id}">Delete</button>
        `;
        vaultItemsDiv.appendChild(div);
      });
    };

    // Function to show vault
    const showVault = () => {
      authSection.style.display = "none";
      signupSection.style.display = "none";
      vaultSection.style.display = "block";

      const currentUser = firebase.auth().currentUser;
      if (currentUser) {
        const q = firebase.firestore().collection("vault").where("userId", "==", currentUser.uid);
        q.onSnapshot((snapshot) => {
          const items = [];
          snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
          renderVaultItems(items);
          console.log("Snapshot updated");
        });
      }
    };

    // Handle Auth State Changes
    firebase.auth().onAuthStateChanged(user => {
      if (user) {
        showVault();
      } else {
        vaultSection.style.display = "none";
        authSection.style.display = "block";
      }
    });

    // Event listener for deleting vault items
    vaultItemsDiv.addEventListener("click", async (e) => {
      if (e.target.classList.contains("delete-btn")) {
        const itemId = e.target.dataset.id;
        try {
          await firebase.firestore().collection("vault").doc(itemId).delete();
          console.log("Document deleted:", itemId);
        } catch (error) {
          console.error("Error deleting document:", error.message);
          alert("Failed to delete item: " + error.message);
        }
      }
    });

    // --- Family Plan Functions ---
    // Function to create a family
    const createFamily = async () => {
      const familyName = document.getElementById("familyNameInput").value;
      if (!familyName) {
        alert("Please enter a family name.");
        return;
      }
      if (!firebase.auth().currentUser) {
        alert("You must be logged in to create a family.");
        return;
      }
      try {
        const user = firebase.auth().currentUser;
        const userDocRef = firebase.firestore().doc('users/' + user.uid);
        const familyDocRef = await firebase.firestore().collection('families').add({
          ownerUid: user.uid,
          members: [user.uid],
          familyName: familyName,
        });

        await userDocRef.update({
          familyId: familyDocRef.id,
        });

        console.log('Family created!');
        alert("Family Created!");
      } catch (error) {
        console.error("Error creating family:", error.message);
        alert("Failed to create family: " + error.message);
      }
    };
    document.getElementById("createFamilyBtn").onclick = createFamily;

    // Function to join a family
    const joinFamily = async () => {
      const familyId = document.getElementById("familyIdInput").value;
      if (!familyId) {
        alert("Please enter a valid Family ID.");
        return;
      }
      if (!firebase.auth().currentUser) {
        alert("You must be logged in to join a family.");
        return;
      }
      try {
        const user = firebase.auth().currentUser;
        const userDocRef = firebase.firestore().doc('users/' + user.uid);
        const familyDocRef = firebase.firestore().doc('families/' + familyId);
        const familyDoc = await familyDocRef.get();

        if (!familyDoc.exists) {
          alert("Family not found.");
          return;
        }

        await familyDocRef.update({
          members: firebase.firestore.FieldValue.arrayUnion(user.uid),
        });

        await userDocRef.update({
          familyId: familyId,
        });

        console.log('Joined family!');
        alert("Successfully joined the family!");
      } catch (error) {
        console.error("Error joining family:", error.message);
        alert("Failed to join family: " + error.message);
      }
    };
    document.getElementById("joinFamilyBtn").onclick = joinFamily;
  </script>
</body>
</html>
