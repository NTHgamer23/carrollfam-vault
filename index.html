<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Login</title>
    <script type="module" src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-sha3@0.9.2/src/sha3.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            background-color: #f5f5f5;
            margin: 0;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }
        button:active {
            background-color: #007bff;
            color: white;
        }
        .container {
            max-width: 500px;
            margin-top: 50px;
        }
        .vault-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            border-radius: 5px;
            background: #fff;
        }
        .input-group {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Authentication Section -->
    <div id="auth-section">
        <h2>Login</h2>
        <input class="form-control mb-2" type="email" id="loginEmail" placeholder="Email">
        <input class="form-control mb-2" type="password" id="loginPassword" placeholder="Password">
        <button class="btn btn-primary w-100" id="loginBtn">Login</button>
        <p class="mt-2 text-center">or</p>
        <button class="btn btn-secondary w-100" id="showSignup">Go to Signup</button>
    </div>

    <!-- Signup Section -->
    <div id="signup-section" style="display:none;">
        <h2>Signup</h2>
        <input class="form-control mb-2" type="email" id="signupEmail" placeholder="Email">
        <input class="form-control mb-2" type="password" id="signupPassword" placeholder="Password">
        <button class="btn btn-success w-100" id="signupBtn">Sign Up</button>
        <p class="mt-2 text-center">or</p>
        <button class="btn btn-secondary w-100" id="showLogin">Back to Login</button>
    </div>

    <!-- Vault Section -->
    <div id="vault-section" style="display:none;">
        <h2>Vault</h2>
        <div class="input-group mb-3">
            <input type="text" class="form-control" id="vaultInput" placeholder="New item...">
            <button class="btn btn-outline-success" id="addVaultBtn">Add</button>
        </div>
        <div id="vaultItems"></div>
        <button class="btn btn-danger w-100 mt-3" id="logoutBtn">Logout</button>
    </div>

    <!-- Secret Key Prompt -->
    <div id="keyPrompt" style="display:none;">
        <h3>Enter Secret Key</h3>
        <input class="form-control mb-2" type="text" id="secretKeyInput" placeholder="Enter secret key">
        <button class="btn btn-primary w-100" id="submitKeyBtn">Submit</button>
    </div>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
