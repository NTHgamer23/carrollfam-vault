<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarrollFam Vault</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="login-box">
    <h1>CarrollFam Login</h1>
    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <p id="login-error"></p>
  </div>

  <div id="vault" style="display: none;">
    <h2>Saved Passwords</h2>
    <div id="cloud">
      <span class="pw">Netflix: Carroll123</span>
      <span class="pw">Hulu: Carroll456</span>
      <span class="pw">Bank: CarrollBank789</span>
      <span class="pw">Email: carrollfam@mail.com</span>
    </div>
  </div>

  <!-- Load bcrypt.js before your custom script -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bcrypt.js/2.4.3/bcrypt.min.js"></script>
  <script>
    // Check if bcrypt is loaded properly
    console.log(bcrypt); // You should see the bcrypt object in the console
  </script>
  <script src="script.js"></script>
</body>
</html>
