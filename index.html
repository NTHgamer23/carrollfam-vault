<script type="text/javascript">
    var gk_fileData = {};
    function loadFileData(filename) {
      return gk_fileData[filename] || "";
    }
    </script><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CarrollFam Vault - Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="login-box">
    <h1>CarrollFam Login (Demo)</h1>
    <p class="description">Enter credentials to access the vault.</p>

    <form id="login-form" onsubmit="login(event)">
      <div>
        <label for="username" class="sr-only">Username</label>
        <input type="text" id="username" placeholder="Username" required />
      </div>
      <div>
        <label for="password" class="sr-only">Password</label>
        <input type="password" id="password" placeholder="Password" required />
      </div>
      <button type="submit" id="login-button">Login</button>
      <div id="login-error-container" aria-live="polite">
        <p id="login-error" class="error-message"></p>
      </div>
    </form>
  </div>

  <div id="vault" style="display: none;">
    <div class="vault-header">
      <h2>Vault Contents</h2>
      <button type="button" id="theme-toggle">Toggle Dark Mode</button>
    </div>
    <div id="master-key-section" style="display: none;">
      <label for="master-key">Master Key (for encryption)</label>
      <input type="password" id="master-key" placeholder="Enter master key" />
      <button type="button" onclick="setMasterKey()">Set Key</button>
    </div>
    <div class="vault-controls">
      <input type="text" id="vault-search" placeholder="Search by website or username" />
      <button type="button" onclick="exportVault()">Export Vault</button>
      <button type="button" onclick="document.getElementById('import-file').click()">Import Vault</button>
      <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importVault(event)" />
      <button type="button" onclick="showAnalytics()">View Analytics</button>
    </div>
    <form id="vault-form" onsubmit="addOrUpdateVaultItem(event)">
      <input type="hidden" id="edit-index" />
      <div>
        <label for="vault-website" class="sr-only">Website</label>
        <input type="text" id="vault-website" placeholder="Website" required />
      </div>
      <div>
        <label for="vault-username" class="sr-only">Username</label>
        <input type="text" id="vault-username" placeholder="Username" required />
      </div>
      <div class="password-container">
        <label for="vault-password" class="sr-only">Password</label>
        <input type="password" id="vault-password" placeholder="Password" required />
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">Show</button>
      </div>
      <div>
        <label for="vault-note" class="sr-only">Note</label>
        <textarea id="vault-note" placeholder="Note"></textarea>
      </div>
      <button type="submit" id="vault-submit">Add Item</button>
      <button type="button" id="cancel-edit" onclick="cancelEdit()" style="display: none;">Cancel</button>
    </form>
    <div id="vault-items">
      <!-- Dynamically populated -->
    </div>
    <button type="button" onclick="logout()">Logout</button>
  </div>

  <div id="analytics-modal" style="display: none;">
    <div class="modal-content">
      <h2>Analytics</h2>
      <div id="analytics-content"></div>
      <button type="button" onclick="closeAnalytics()">Close</button>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
