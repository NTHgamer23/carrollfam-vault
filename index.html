<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>CarrollFam Vault - Demo</title>
  <link rel="stylesheet" href="styles.css?v=1.9" />
</head>
<body>
  <div id="login-box">
    <h1>CarrollFam Login (Demo)</h1>
    <p class="description">Enter credentials to access the vault.</p>

    <form id="login-form" onsubmit="login(event)">
      <div>
        <label for="username" class="sr-only">Username</label>
        <input type="text" id="username" placeholder="Username" required autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      </div>
      <div>
        <label for="password" class="sr-only">Password</label>
        <input type="password" id="password" placeholder="Password" required autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      </div>
      <button type="submit">Login</button>
      <div id="login-error-container" aria-live="polite">
        <p id="login-error" class="error-message"></p>
      </div>
    </form>
  </div>

  <div id="vault" style="display: none;">
    <h2>Vault Contents</h2>
    <p class="storage-notice">Items stored in memory, sync with code.</p>
    <form id="vault-form" onsubmit="addVaultItem(event)">
      <div>
        <label for="vault-website" class="sr-only">Website</label>
        <input type="text" id="vault-website" placeholder="Website" required autocomplete="off" />
      </div>
      <div>
        <label for="vault-username" class="sr-only">Username</label>
        <input type="text" id="vault-username" placeholder="Username" required autocomplete="off" />
      </div>
      <div>
        <label for="vault-password" class="sr-only">Password</label>
        <input type="password" id="vault-password" placeholder="Password" required autocomplete="off" />
      </div>
      <div>
        <label for="vault-note" class="sr-only">Note</label>
        <textarea id="vault-note" placeholder="Note"></textarea>
      </div>
      <button type="submit">Add Item</button>
    </form>
    <div id="vault-items">
      <!-- Dynamically populated -->
    </div>
    <div class="sync-controls">
      <button type="button" onclick="exportVault()">Export Vault</button>
      <div class="import-section">
        <label for="import-code" class="sr-only">Import Sync Code</label>
        <input type="text" id="import-code" placeholder="Paste sync code" autocomplete="off" />
        <button type="button" onclick="importVault()">Import Vault</button>
      </div>
    </div>
    <button type="button" onclick="logout()">Logout</button>
  </div>

  <script src="script.js?v=1.9"></script>
</body>
</html>
