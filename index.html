<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CarrollFam Vault</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="login-box">
        <h1>CarrollFam Login</h1>
        <input type="text" id="username" placeholder="Username" aria-label="Username"/>
        <input type="password" id="password" placeholder="Password" aria-label="Password"/>
        <button id="login-button">Login</button>
        <p id="login-error" class="error-message"></p>
    </div>

    <div id="vault" style="display: none;">
        <h2>Saved Passwords</h2>
        <div id="cloud">
            <div class="pw"><strong>Netflix:</strong> <span class="password-value">Carroll123</span></div>
            <div class="pw"><strong>Hulu:</strong> <span class="password-value">Carroll456</span></div>
            <div class="pw"><strong>Bank:</strong> <span class="password-value">CarrollBank789</span></div>
            <div class="pw"><strong>Email:</strong> <span class="password-value">carrollfam@mail.com</span></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bcrypt.js/2.4.3/bcrypt.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
