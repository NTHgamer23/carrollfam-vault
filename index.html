<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            width: 300px;
            margin: 0 auto;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            padding: 10px;
            width: 100%;
            margin-top: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .message {
            color: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <input type="text" id="loginEmail" placeholder="Enter email" required />
        <input type="password" id="loginPassword" placeholder="Enter password" required />
        <button onclick="logIn()">Login</button>

        <h2>Sign Up</h2>
        <input type="text" id="signUpEmail" placeholder="Enter email" required />
        <input type="password" id="signUpPassword" placeholder="Enter password" required />
        <button onclick="signUp()">Sign Up</button>

        <div id="message" class="message"></div>
    </div>

    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyDZdQx1OxvaL1Irrwx2OMRRUkAYAz4Jpio",
            authDomain: "carroll-fam-v.firebaseapp.com",
            projectId: "carroll-fam-v",
            storageBucket: "carroll-fam-v.firebasestorage.app",
            messagingSenderId: "31202730208",
            appId: "1:31202730208:web:424f6d013231a970ae3085",
            measurementId: "G-6L6FH62554"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // Sign Up function
        function signUp() {
            const email = document.getElementById("signUpEmail").value;
            const password = document.getElementById("signUpPassword").value;

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    db.ref('users/' + user.uid).set({
                        email: user.email,
                        createdAt: new Date().toISOString(),
                    });

                    document.getElementById("message").textContent = "Account created successfully! Please log in.";
                    window.location.href = 'index.html';  // Redirect to login page after sign-up
                })
                .catch((error) => {
                    console.error("Error signing up:", error.message);
                    alert(error.message);
                });
        }

        // Log In function
        function logIn() {
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    console.log("User logged in:", user);
                    window.location.href = 'dashboard.html';  // Redirect to a dashboard or home page
                })
                .catch((error) => {
                    console.error("Error logging in:", error.message);
                    alert(error.message);
                });
        }
    </script>
</body>
</html>
