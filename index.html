<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault Login</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900">
  <div id="auth-section" class="p-6 max-w-sm mx-auto mt-10 bg-white shadow-md rounded">
    <h1 class="text-2xl font-bold mb-4">Vault</h1>
    <input id="email" type="email" placeholder="Email" class="w-full mb-2 p-2 border rounded">
    <input id="password" type="password" placeholder="Password" class="w-full mb-4 p-2 border rounded">
    <button onclick="login()" class="w-full bg-blue-600 text-white p-2 rounded mb-2">Login</button>
    <button onclick="signup()" class="w-full bg-green-600 text-white p-2 rounded">Sign Up</button>
  </div>

  <div id="dashboard" class="hidden p-6 max-w-xl mx-auto mt-10 bg-white shadow-md rounded">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold">Your Vault</h2>
      <button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded">Logout</button>
    </div>
    <div class="mb-4">
      <input id="vault-key" type="text" placeholder="Service (e.g. Gmail)" class="w-full mb-2 p-2 border rounded">
      <input id="vault-password" type="text" placeholder="Password" class="w-full mb-2 p-2 border rounded">
      <button onclick="savePassword()" class="bg-blue-500 text-white p-2 rounded">Save Password</button>
    </div>
    <ul id="vault-list" class="space-y-2"></ul>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDZdQx1OxvaL1Irrwx2OMRRUkAYAz4Jpio",
      authDomain: "carroll-fam-v.firebaseapp.com",
      projectId: "carroll-fam-v",
      storageBucket: "carroll-fam-v.appspot.com",
      messagingSenderId: "31202730208",
      appId: "1:31202730208:web:424f6d013231a970ae3085",
      measurementId: "G-6L6FH62554"
    };
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.database();

    const authSection = document.getElementById('auth-section');
    const dashboard = document.getElementById('dashboard');
    const vaultList = document.getElementById('vault-list');

    function showDashboard() {
      authSection.classList.add('hidden');
      dashboard.classList.remove('hidden');
      loadVault();
    }

    function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(email, password)
        .then(() => showDashboard())
        .catch(err => alert(err.message));
    }

    function signup() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      auth.createUserWithEmailAndPassword(email, password)
        .then(() => {
          alert("Account created. Please log in.");
        })
        .catch(err => alert(err.message));
    }

    function logout() {
      auth.signOut().then(() => {
        dashboard.classList.add('hidden');
        authSection.classList.remove('hidden');
      });
    }

    function savePassword() {
      const key = document.getElementById('vault-key').value;
      const password = document.getElementById('vault-password').value;
      const uid = auth.currentUser.uid;
      if (key && password) {
        db.ref('vault/' + uid + '/' + key).set(password);
        loadVault();
      }
    }

    function loadVault() {
      vaultList.innerHTML = '';
      const uid = auth.currentUser.uid;
      db.ref('vault/' + uid).once('value').then(snapshot => {
        snapshot.forEach(child => {
          const li = document.createElement('li');
          li.textContent = `${child.key}: ${child.val()}`;
          li.classList.add('border', 'p-2', 'rounded', 'bg-gray-100');
          vaultList.appendChild(li);
        });
      });
    }

    auth.onAuthStateChanged(user => {
      if (user) showDashboard();
    });
  </script>
</body>
</html>
