<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Vault Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Vault Access</h1>

  <div id="auth-section">
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button id="loginBtn">Log In</button>
    <p><a href="#" id="showSignup">Need an account?</a></p>
  </div>

  <div id="signup-section" style="display:none;">
    <input type="email" id="signupEmail" placeholder="Email">
    <input type="password" id="signupPassword" placeholder="Password">
    <button id="signupBtn">Sign Up</button>
    <p><a href="#" id="showLogin">Already have an account?</a></p>
  </div>

  <div id="vault-section" style="display:none;">
    <input type="text" id="vaultInput" placeholder="Add to vault">
    <button id="addVaultBtn">Add</button>
    <button id="logoutBtn">Log Out</button>
    <div id="vaultItems"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
