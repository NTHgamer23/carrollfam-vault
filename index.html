<div id="auth-section">
    <input type="email" id="loginEmail" placeholder="Email" />
    <input type="password" id="loginPassword" placeholder="Password" />
    <button id="loginBtn">Login</button>
    <button id="showSignup">Sign up</button>
</div>

<div id="signup-section" style="display: none;">
    <input type="email" id="signupEmail" placeholder="Email" />
    <input type="password" id="signupPassword" placeholder="Password" />
    <button id="signupBtn">Sign Up</button>
    <button id="showLogin">Back to Login</button>
</div>

<div id="vault-section" style="display: none;">
    <h3>Your Vault</h3>
    <input type="text" id="vaultInput" placeholder="Enter vault item" />
    <button id="addVaultBtn">Add Item</button>
    <div id="vaultItems"></div>
    <button id="logoutBtn">Logout</button>
</div>

<div id="family-section">
    <input type="text" id="familyNameInput" placeholder="Family Name" />
    <button id="createFamilyBtn">Create Family</button>
    <input type="text" id="familyIdInput" placeholder="Family ID" />
    <button id="joinFamilyBtn">Join Family</button>
</div>
