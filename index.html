<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vault Login</title>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { background-color: #f8f9fa; }
    .container { max-width: 500px; margin-top: 100px; }
    .vault-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border: 1px solid #ddd; margin-bottom: 10px; border-radius: 5px; background: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <div id="auth-section">
      <h2>Login</h2>
      <input class="form-control mb-2" type="email" id="loginEmail" placeholder="Email" />
      <input class="form-control mb-2" type="password" id="loginPassword" placeholder="Password" />
      <button class="btn btn-primary w-100" id="loginBtn">Login</button>
      <p class="mt-2 text-center">or</p>
      <button class="btn btn-secondary w-100" id="showSignup">Go to Signup</button>
    </div>

    <div id="signup-section" style="display:none;">
      <h2>Signup</h2>
      <input class="form-control mb-2" type="email" id="signupEmail" placeholder="Email" />
      <input class="form-control mb-2" type="password" id="signupPassword" placeholder="Password" />
      <button class="btn btn-success w-100" id="signupBtn">Sign Up</button>
      <p class="mt-2 text-center">or</p>
      <button class="btn btn-secondary w-100" id="showLogin">Back to Login</button>
    </div>

    <div id="vault-section" style="display:none;">
      <h2>Vault</h2>
      <div class="input-group mb-3">
        <input type="text" class="form-control" id="vaultInput" placeholder="New item..." />
        <button class="btn btn-outline-success" id="addVaultBtn">Add</button>
      </div>
      <div id="vaultItems"></div>
      <button class="btn btn-danger w-100 mt-3" id="logoutBtn">Logout</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDZdQx1OxvaL1Irrwx2OMRRUkAYAz4Jpio",
      authDomain: "carroll-fam-v.firebaseapp.com",
      projectId: "carroll-fam-v",
      storageBucket: "carroll-fam-v.appspot.com",
      messagingSenderId: "31202730208",
      appId: "1:31202730208:web:424f6d013231a970ae3085",
      measurementId: "G-6L6FH62554"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const authSection = document.getElementById("auth-section");
    const signupSection = document.getElementById("signup-section");
    const vaultSection = document.getElementById("vault-section");
    const vaultItemsDiv = document.getElementById("vaultItems");

    document.getElementById("loginBtn").onclick = () => {
      const email = document.getElementById("loginEmail").value;
      const pass = document.getElementById("loginPassword").value;
      signInWithEmailAndPassword(auth, email, pass)
        .then(() => showVault())
        .catch(err => alert(err.message));
    };

    document.getElementById("signupBtn").onclick = () => {
      const email = document.getElementById("signupEmail").value;
      const pass = document.getElementById("signupPassword").value;
      createUserWithEmailAndPassword(auth, email, pass)
        .then(() => {
          alert("Account created!");
          signupSection.style.display = "none";
          authSection.style.display = "block";
        })
        .catch(err => alert(err.message));
    };

    document.getElementById("showSignup").onclick = () => {
      authSection.style.display = "none";
      signupSection.style.display = "block";
    };

    document.getElementById("showLogin").onclick = () => {
      signupSection.style.display = "none";
      authSection.style.display = "block";
    };

    document.getElementById("logoutBtn").onclick = () => {
      signOut(auth);
    };

    document.getElementById("addVaultBtn").onclick = async () => {
      const item = document.getElementById("vaultInput").value;
      if (!item) return;
      await addDoc(collection(db, "vault"), {
        item,
        userId: auth.currentUser.uid
      });
      document.getElementById("vaultInput").value = "";
    };

    const renderVaultItems = (items) => {
      vaultItemsDiv.innerHTML = "";
      items.forEach(({ id, item }) => {
        const div = document.createElement("div");
        div.className = "vault-item";
        div.innerHTML = `
          <span>${item}</span>
          <button class="btn btn-sm btn-danger" onclick="deleteVaultItem(\"${id}\")">Delete</button>
        `;
        vaultItemsDiv.appendChild(div);
      });
    };

    window.deleteVaultItem = async (id) => {
      await deleteDoc(doc(db, "vault", id));
    };

    const showVault = () => {
      authSection.style.display = "none";
      signupSection.style.display = "none";
      vaultSection.style.display = "block";

      const q = query(collection(db, "vault"), where("userId", "==", auth.currentUser.uid));
      onSnapshot(q, (snapshot) => {
        const items = [];
        snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
        renderVaultItems(items);
      });
    };

    onAuthStateChanged(auth, user => {
      if (user) showVault();
      else {
        vaultSection.style.display = "none";
        authSection.style.display = "block";
      }
    });
  </script>
</body>
</html>
